[project]
name = "fares"
version = "0.1.0"
description = "DTW-MIA fare tracking and alerting"
requires-python = ">=3.11"
# No runtime dependencies: the core is stdlib-only, which keeps the
# GitHub Actions run fast and removes a supply-chain surface for a job
# that holds an API key.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# For ad-hoc analysis of the JSONL panel later; not needed by the sweep.
analysis = ["duckdb>=1.0"]

[project.scripts]
fares = "fares.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]
